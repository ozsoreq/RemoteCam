name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: Commit emulator screenshots to docs/screenshots
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug + release APKs and run unit tests
        run: ./gradlew --no-daemon assembleDebug assembleRelease testDebugUnitTest

      - name: APK size
        run: ls -la app/build/outputs/apk/*/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: afar-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  ui-tests:
    # Walks the real app on an Android 14 emulator and captures screenshots of each screen.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || touch tests-failed
            adb root || true
            sleep 3
            mkdir -p screens && adb pull /sdcard/Android/data/app.afar/files/screens/. screens/ || true
            adb logcat -d > logcat.txt || true
            cat app/build/outputs/androidTest-results/connected/debug/*.xml || true
            test ! -f tests-failed

      # Manual runs can refresh the README screenshots (never on ordinary pushes).
      - name: Commit screenshots to docs/screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.update_screenshots
        run: |
          mkdir -p docs/screenshots
          cp screens/*.jpg docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Update app screenshots from emulator [skip ci]" && git push origin HEAD:${{ github.ref_name }} || echo "No screenshot changes"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screens-and-reports
          path: |
            screens/
            logcat.txt
            app/build/reports/androidTests/
          if-no-files-found: ignore
