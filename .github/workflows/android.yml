name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: Commit emulator screenshots to docs/screenshots
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # True once the upload-key secrets are configured (see docs/RELEASE_CHECKLIST.md).
      HAS_UPLOAD_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build APKs + Play bundle and run unit tests
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease testDebugUnitTest

      - name: Signing status
        run: |
          if [ "$HAS_UPLOAD_KEY" = "true" ]; then
            echo "Release APK/AAB signed with the upload key: ready for Play."
          else
            echo "::warning::Release APK/AAB are signed with the DEBUG key. Add the upload-key secrets (docs/RELEASE_CHECKLIST.md) before uploading to Play."
          fi

      - name: 16 KB page-size check (Google Play requirement)
        run: scripts/check-16kb.sh app/build/outputs/apk/release/app-release.apk

      - name: Sizes
        run: ls -la app/build/outputs/apk/*/*.apk app/build/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: holdthatpose-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: holdthatpose-play-bundle
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  ui-tests:
    # Walks the real app on an Android 14 emulator and captures screenshots of each screen.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || touch tests-failed
            adb root || true
            sleep 3
            mkdir -p screens && adb pull /sdcard/Android/data/app.holdthatpose/files/screens/. screens/ || true
            mkdir -p store && adb pull /sdcard/Android/data/app.holdthatpose/files/store/. store/ || true
            adb logcat -d > logcat.txt || true
            cat app/build/outputs/androidTest-results/connected/debug/*.xml || true
            test ! -f tests-failed

      # Refresh docs/screenshots only when asked: a manual run, or a pushed commit whose
      # message contains "[screenshots]". Ordinary pushes never commit anything.
      - name: Commit screenshots to docs/screenshots
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.update_screenshots) ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[screenshots]'))
        run: |
          mkdir -p docs/screenshots
          cp screens/*.jpg docs/screenshots/
          mkdir -p docs/store && cp store/*.png docs/store/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots docs/store
          git commit -m "Update app screenshots from emulator [skip ci]" && git push origin HEAD:${{ github.ref_name }} || echo "No screenshot changes"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screens-and-reports
          path: |
            screens/
            store/
            logcat.txt
            app/build/reports/androidTests/
          if-no-files-found: ignore
